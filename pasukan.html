<!-- content -->
    <style>
.content {
    .opsi {
        padding: 1rem;
        width: 100%;

        display: flex;
        gap: 1rem;
        .memilihTH {
            flex: 3;
            aspect-ratio: 1;
            background: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .gambarTh {
                box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0.3);
                height: 100%;
                width: 100%;
                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease, box-shadow .3s ease;
                img {
                    width: 100%;
                }
            }
            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        
        .memilihKategori {
            width: 100%;
            flex: 3;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            background-color: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .tulisan {
                box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0.3);

                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;

                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease, box-shadow .3s ease;
                .h1 {
                    font-size: 2.1rem;              
                    line-height: 1.1;
                }
            }
            .icon {

                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        .sedangMemilih {
            background-color: var(--silver);
            .gambarTh {
                background-color: var(--hitam);
                box-shadow: 0px 0px 15px 0px rgba(0, 0, 0, 0.3);
            }
            .tulisan {
                color: var(--putih);
                background-color: var(--hitam);
                box-shadow: 0px 0px 15px 0px rgba(0, 0, 0, 0.3);
            }
            .icon {
                svg {
                    stroke:var(--hitam);
                }
            }
        }
    }

    .actived {
        height: 8rem !important;
    }
    .pilihanOpsi {
        width: 100%;
        height: 0;
        background-color: var(--hitam);
        position: relative;

        display: flex;
        justify-content: space-between;
        align-items: center;

        transition: height .3s ease;
        .tengah {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            
            grid-template-rows: 1fr;
            .kumpulan {
                width: 100%;
                max-width: 100vw;
                height: 8rem;

                overflow-x: scroll;
                width: max-content;

                display: flex;

                gap: 2rem;
                padding: 1rem;
                img {
                    height: 100%;
                    width: auto;
                }
            }
            .kumpulan::-webkit-scrollbar {
                display: none;
            }
        }
        .geser {
            height: 100%;
            display: flex;
            align-items: center;
            opacity: .8;

            position: absolute;
            img {
                width: 2rem;
            }
        }
        .kanan {
            right: 0;
        }
    }
    .pilihanOpsiKategori {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        transform: translateY(100%);
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;

        /* 1 angka lebih dari header nav */
        z-index: 11;
        .background {
            width: 100%;
            height: 100%;
            background-color: var(--hitam);
            opacity: 0;
            transition: opacity .3s ease;
        }
        .pilihanKategori2 {
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 2rem 2rem 0 0;
            height: 60vh;
            width: 100%;
            background-color: var(--putih);
            transform: translateY(100%);
            transition: transform .3s ease;

            .choice {
                margin-top: 1rem;
                display: flex;
                flex-direction: column;
                gap: .3rem;
            }
        }
    }
    .pilihanOpsiKategoriMuncul {
        transform: translateY(0);
        .background {
            opacity: .7;
        }
        .pilihanKategori2 {
            transform: translateY(0);
            padding: 1rem;
        }
    }
    .garis {
        width: 100%;
        height: 2px;
        background-color: var(--silver);
    }

    .tampilkanHasil {
        width: 100%;
        height: 100%;
        padding: 2rem 1rem;

        .filter {
            margin: 3rem 0 0 0;
            width: 100%;
            display: flex;
            justify-content: center;
            .tengah {
                padding: 1rem 1rem;

                background-color: var(--silver);
                border-radius: 5rem;
                display: flex;
                align-items: center;
                gap: 1.6rem;

                height: 2.8rem;
                position: relative;
                

                .terpilihBg {
                    height: calc(100% - .5rem);
                    width: calc(56px + 1.4rem);

                    border-radius: 3rem;
                    background-color: #fff;
                    position: absolute;
                    left: .2rem;
                    transition: left .3s ease, width .1s ease;
                    
                    box-shadow: 0px 0px 2px 0px rgba(0, 0, 0, 0.092);
                }
                .pilihan {
                    position: relative;
                    opacity: .5;
                    transition: opacity .3s ease;
                    cursor: pointer;
                    h2 {
                        font-weight: 600;
                        font-size: 1.1rem;
                    }
                }
                .terpilih {
                    opacity: 1;
                }
            }
        }
    }
}
    </style>
</head>

    .menu {

        .menuan {
            h2 {

            .garisBawah {

                background-color: var(--hitam);
                opacity: 0;
            }

        .active {

    }
</style>

<style>

/* Membuat animasi kursor berkedip */
.kursor {
    display: inline-block;
    color: #333;
    animation: kedip 0.7s infinite;
}

@keyframes kedip {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>

<script>
    const pilihTh = document.querySelector('.memilihTH');
    const pilihanOpsi = document.querySelector('.pilihanOpsi');

    const memilihKategori = document.querySelector('.memilihKategori');
    const pilihanOpsiKategori = document.querySelector('.pilihanOpsiKategori');

    pilihTh.addEventListener("click", function(){
        console.log("pencet");
        pilihTh.classList.toggle('sedangMemilih');
        pilihanOpsi.classList.toggle('actived');
    });

    memilihKategori.addEventListener("click", function(){
        console.log("pencet");
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
    pilihanOpsiKategori.querySelector(".background").addEventListener("click", function(){
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
        


</script>

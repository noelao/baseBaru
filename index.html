<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>elplongor Base</title>
    <style>
        @font-face {
            font-family: mobbin;
            src: url(./public/fonts/mobbin.woff2);
        }

        :root {
            --putih:#fff;
            --hitam:#000;
            --silver:#F0F0F0;

            --hitam2:#161A13;
            --hijau:#86DB6B;

            --ungu:#ECE6ED;
            --ungu2:#9D80A3;
            --bgUngu: #FFFDFC;



            --tinggiHeader: 1rem;
        }
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-family: mobbin;
            color: var(--hitam);
            width: 100%;
            height: 100%;
            background-color: var(--bgUngu);

            font-size: .8rem;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>

<!-- header -->
    <style>
header {
    position: sticky;
    top: 0;
    left: 0;
    
    height: var(--tinggiHeader);
    width: 100%;
    background: linear-gradient(135deg, #4f46e5, #ec4899);
}
    </style>

<!-- content -->
    <style>
.content {
    height: max-content;
    min-height: 100vh;
    width: 100%;

    .opsi {
        padding: 1rem;
        width: 100%;

        display: flex;
        gap: 1rem;
        .memilihTH {
            flex: 3;
            aspect-ratio: 1;
            background: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .gambarTh {
                box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0.3);
                height: 100%;
                width: 100%;
                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease, box-shadow .3s ease;
                img {
                    width: 100%;
                }
            }
            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        
        .memilihKategori {
            width: 100%;
            flex: 3;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            background-color: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .tulisan {
                box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0.3);

                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;

                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease, box-shadow .3s ease;
                .h1 {
                    font-size: 2.1rem;              
                    line-height: 1.1;
                }
            }
            .icon {

                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        .sedangMemilih {
            background-color: var(--silver);
            .gambarTh {
                background-color: var(--hitam);
                box-shadow: 0px 0px 15px 0px rgba(0, 0, 0, 0.3);
            }
            .tulisan {
                color: var(--putih);
                background-color: var(--hitam);
                box-shadow: 0px 0px 15px 0px rgba(0, 0, 0, 0.3);
            }
            .icon {
                svg {
                    stroke:var(--hitam);
                }
            }
        }
    }

    .actived {
        height: 10rem !important;
    }
    .pilihanOpsi {
        width: 100%;
        height: 0;
        background-color: var(--hitam);
        position: relative;

        display: flex;
        justify-content: space-between;
        align-items: center;

        transition: height .3s ease;
        .tengah {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            
            grid-template-rows: 1fr;
            .kumpulan {
                width: 100%;
                max-width: 100vw;
                height: 10rem;

                overflow-x: scroll;
                width: max-content;

                display: flex;

                gap: 2rem;
                padding: 2rem;
                img {
                    height: 100%;
                    width: auto;
                }
            }
            .kumpulan::-webkit-scrollbar {
                display: none;
            }
        }
        .geser {
            height: 100%;
            display: flex;
            align-items: center;
            opacity: .8;

            position: absolute;
            img {
                width: 2rem;
            }
        }
        .kanan {
            right: 0;
        }
    }
    .pilihanOpsiKategori {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        transform: translateY(100%);
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;

        /* 1 angka lebih dari header nav */
        z-index: 11;
        .background {
            width: 100%;
            height: 100%;
            background-color: var(--hitam);
            opacity: 0;
            transition: opacity .3s ease;
        }
        .pilihanKategori2 {
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 2rem 2rem 0 0;
            height: 60vh;
            width: 100%;
            background-color: var(--putih);
            transform: translateY(100%);
            transition: transform .3s ease;
        }
    }
    .pilihanOpsiKategoriMuncul {
        transform: translateY(0);
        .background {
            opacity: .7;
        }
        .pilihanKategori2 {
            transform: translateY(0);
            padding: 1rem;
        }
    }
    .garis {
        width: 100%;
        height: 2px;
        background-color: var(--silver);
    }

    .tampilkanHasil {
        width: 100%;
        height: 100%;
        padding: 1rem;
    }
}
    </style>
</head>

<style>

/* Membuat animasi kursor berkedip */
.kursor {
    display: inline-block;
    color: #333;

<style>
    .navbar {
        position: sticky;
        top: .5rem;

        .iniNav {

                    display: flex;

                    justify-content: center;

                    position: relative;
                    .garis {
                        background-color: #ababab;

                        width: 90%;

                    }

                .bawah {
                    height: 3rem;

                    justify-content: space-between;
                    padding: .5rem 1.5rem;
                    .logo {
                        
                    }
                    .navMenu {
                        padding: .5rem;
                        height: 100%;
                        aspect-ratio: 1;
                        display: flex;
                        flex-direction: column;
                        justify-content: space-evenly;
                        span {
                            width: 100%;
                            height: 3px;
                            background-color: #000;
                            transition: transform .3s ease;
                        }
                    }
                }
            }
        }
    }
    
    .kepencet {
        .iniNav {
            .iniWarnaNav {
                .atas {
                    height: 5.5rem;
                }
                .bawah {
                    .navMenu {
                        span:nth-child(1) {
                            transform: rotate(30deg);
                        }
                        span:nth-child(2) {
                            transform: rotate(30deg);
                        }
                    }
                }
            }
        }
    }
</style>

<style>
/* Footer Container */
.main-footer {
    min-height: 50vh;

    width: 100%;
    padding: 20px 0;
    border-top: 1px solid #eeeeee; /* Garis tipis transparan */
    background-color: transparent; /* Mengikuti background body */
    font-family: inherit; /* Menggunakan font utama kamu */
    margin-top: 1rem;

}

.footer-content {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    color: #666; /* Warna teks abu-abu minimalis */
    font-size: 0.9rem;
}

/* Styling Efek Mengetik */
.highlight {
    color: #333; /* Warna lebih gelap untuk teks yang diketik */
    font-weight: 600;
}

.cursor {
    color: #007bff; /* Warna kursor (sesuaikan dengan tema kamu) */

    animation: blink 0.7s infinite;
    background: #007bff;
}

/* Responsif untuk HP */
@media (max-width: 600px) {
    .footer-content {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
}
</style>

<script>
    const pilihTh = document.querySelector('.memilihTH');
    const pilihanOpsi = document.querySelector('.pilihanOpsi');

    const memilihKategori = document.querySelector('.memilihKategori');
    const pilihanOpsiKategori = document.querySelector('.pilihanOpsiKategori');

    pilihTh.addEventListener("click", function(){
        console.log("pencet");
        pilihTh.classList.toggle('sedangMemilih');
        pilihanOpsi.classList.toggle('actived');
    });

    memilihKategori.addEventListener("click", function(){
        console.log("pencet");
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
    pilihanOpsiKategori.querySelector(".background").addEventListener("click", function(){
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
        


</script>

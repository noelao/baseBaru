<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elplongor Base</title>
    <style>
        @font-face {
            font-family: mobbin;
            src: url(./public/fonts/mobbin.woff2);
        }

        :root {
            --putih:#fff;
            --hitam:#000;
            --silver:#F0F0F0;

            --hitam2:#161A13;
            --hijau:#86DB6B;

            --ungu:#ECE6ED;
            --ungu2:#9D80A3;
            --bgUngu: #FFFDFC;



            --tinggiHeader: 1rem;
        }
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-family: mobbin;
            color: var(--hitam);
            width: 100%;
            height: 100%;
            background-color: var(--bgUngu);

            font-size: .8rem;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>

<!-- header -->
    <style>
header {
    position: sticky;
    top: 0;
    left: 0;
    
    height: var(--tinggiHeader);
    width: 100%;
    background: linear-gradient(135deg, #4f46e5, #ec4899);
}
    </style>

<!-- content -->
    <style>
.content {
    height: max-content;
    min-height: 100vh;
    width: 100%;

    .opsi {
        padding: 1rem;
        width: 100%;

        display: flex;
        gap: 1rem;
        .memilihTH {
            flex: 3;
            aspect-ratio: 1;
            background: var(--hitam);
            border-radius: 1.5rem;
            .gambarTh {
                height: 100%;
                width: 100%;
                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                img {
                    width: 100%;
                }
            }
            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                img {
                    width: 2rem;
                    opacity: .8;
                }
            }
        }
        .memilihKategori {
            width: 100%;
            flex: 3;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            background: var(--hitam);
            border-radius: 1.5rem;
            .tulisan {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;

                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                .h1 {
                    font-size: 2.1rem;              
                    line-height: 1.1;
                }
            }
            .icon {

                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                img {
                    width: 2rem;
                    opacity: .8;
                }
            }
        }
    }
    .pilihanOpsi {
        width: 100%;
        aspect-ratio: 2;
        background-color: var(--hitam);

        display: flex;
        justify-content: space-between;
        .tengah {
            flex:1;
        }
        .geser {
            height: 100%;
            display: flex;
            align-items: center;
            img {
                width: 2rem;
                opacity: .8;;
            }
        }
    }

    .tampilkanHasil {
        width: 100%;
        height: 100%;
        padding: 1rem;
    }
}
    </style>
</head>
<style>
    .selamatDatang {
        width: 100%;
        height: 100%;
        padding: 1rem;
        margin: 3rem 0 0 0;
        font-size: 1.2rem;
        .subTitle {
            width: 100%;
            background-color: var(--silver);
            padding: .5rem .8rem;
            border-radius: 0.55rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            .tips {
                padding: .2rem .8rem;
                border-radius: 0.75rem;
                background-color: var(--hitam);
                color: var(--putih);
                font-size: .9rem;
                font-weight: 500;
            }
            p {
                font-size: .9rem;
                font-weight: 500;
            }
        }
    }
    .menu {
        width: 100%;
        padding: 1rem;
        display: flex;
        gap: 1rem;
        .menuan {
            h2 {
                font-size: 1.2rem;
                font-weight: 700;
                padding: .5rem 0;
            }
            .garisBawah {
                width: 100%;
                height: 2px;
                background-color: var(--hitam);
                opacity: 0;
            }
            .active {
                opacity: 1;
            }
        }
    }
</style>
<body>
    <!-- <header></header> -->

    <div class="content">

        <div class="selamatDatang">
            <div class="img">

            </div>
            <h1 style="width: 50%; line-height: 1;">Dear Warrior</h1>
            <div class="subTitle">
                <div class="tips">
                    TIPS
                </div>
                <p>Saya akan lawan !!</p>
            </div>
        </div>
        <div class="menu">
            <a href="#" class="base menuan">
                <h2>Base</h2>
                <div class="garisBawah active"></div>
            </a>
            <a href="#" class="base menuan">
                <h2>Pasukan</h2>
                <div class="garisBawah"></div>
            </a>
        </div>

        <div class="opsi">
            <div class="memilihTH">
                <div class="gambarTh">
                    <img src="./public/image/th/gambar_hd_18.jpg" alt="">
                </div>
                <div class="icon">
                    <img src="./public/image/icon/chevron-down.svg" alt="">
                </div>
            </div>
            <div class="memilihKategori">
                <div class="tulisan">
                    <h1 class="h1">Base Trolls 😂</h1>
                </div>
                <div class="icon">
                    <img src="./public/image/icon/chevron-down.svg" alt="">
                </div>
            </div>
        </div>
        <div class="pilihanOpsi">
            <div class="kiri geser">
                <img src="./public/image/icon/chevron-left.svg" alt="">
            </div>
            <div class="tengah"></div>
            <div class="kanan geser">
                <img src="./public/image/icon/chevron-right.svg" alt="">
            </div>
        </div>
        <div class="tampilkanHasil">
            <h2>Hasil base Untuk TH 18 :</h2>
        </div>
    </div>


<style>
    footer {
        height: 12rem;
        width: 100%;
    }
</style>
    <footer>

    </footer>
</body>
</html>

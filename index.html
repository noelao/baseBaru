    <style>
        @font-face {
            font-family: mobbin;
            src: url(./public/fonts/mobbin.woff2);
        }

        :root {
            --putih:#fff;
            --hitam:#000;
            --silver:#F0F0F0;

            --hitam2:#161A13;
            --hijau:#86DB6B;

            --ungu:#ECE6ED;
            --ungu2:#9D80A3;
            --bgUngu: #FFFDFC;



            --tinggiHeader: 1rem;
        }
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-family: mobbin;
            color: var(--hitam);
            width: 100%;
            height: 100%;
            background-color: var(--bgUngu);

            font-size: .8rem;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>

<!-- header -->
    <style>
header {
    position: sticky;
    top: 0;
    left: 0;
    
    height: var(--tinggiHeader);
    width: 100%;
    background: linear-gradient(135deg, #4f46e5, #ec4899);
}
    </style>

<!-- content -->
    <style>
.content {
    height: max-content;
    min-height: 100vh;
    width: 100%;

    .opsi {
        padding: 1rem;
        width: 100%;

        display: flex;
        gap: 1rem;
        .memilihTH {
            flex: 3;
            aspect-ratio: 1;
            background: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .gambarTh {
                height: 100%;
                width: 100%;
                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease;
                img {
                    width: 100%;
                }
            }
            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        
        .memilihKategori {
            width: 100%;
            flex: 3;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            background-color: var(--hitam);
            border-radius: 1.5rem;
            transition: background-color .3s ease;
            .tulisan {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;

                background-color: var(--silver);
                border-radius: 1.5rem;
                padding: 1rem;
                transition: background-color .3s ease;
                .h1 {
                    font-size: 2.1rem;              
                    line-height: 1.1;
                }
            }
            .icon {

                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem 0;
                svg {
                    width: 2rem;
                    opacity: .8;
                    transition: stroke .3s ease;
                }
            }
        }
        .sedangMemilih {
            background-color: var(--silver);
            .gambarTh {
                background-color: var(--hitam);
            }
            .tulisan {
                color: var(--putih);
                background-color: var(--hitam);
            }
            .icon {
                svg {
                    stroke:var(--hitam);
                }
            }
        }
    }

    .actived {
        height: 12rem !important;
    }
    .pilihanOpsi {
        width: 100%;
        height: 0;
        background-color: var(--hitam);

        display: flex;
        justify-content: space-between;
        align-items: center;

        transition: height .3s ease;
        .tengah {
            flex:1;
        }
        .geser {
            height: 100%;
            display: flex;
            align-items: center;
            img {
                width: 2rem;
                opacity: .8;;
            }
        }
    }
    .pilihanOpsiKategori {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        transform: translateY(100%);
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        .background {
            width: 100%;
            height: 100%;
            background-color: var(--hitam);
            opacity: 0;
            transition: opacity .3s ease;
        }
        .pilihanKategori2 {
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 2rem 2rem 0 0;
            height: 60vh;
            width: 100%;
            background-color: var(--putih);
            transform: translateY(100%);
            transition: transform .3s ease;
        }
    }
    .pilihanOpsiKategoriMuncul {
        transform: translateY(0);
        .background {
            opacity: .7;
        }
        .pilihanKategori2 {
            transform: translateY(0);
            padding: 1rem;
        }
    }
    .garis {
        width: 100%;
        height: 2px;
        background-color: var(--silver);
    }

    .tampilkanHasil {
        width: 100%;
        height: 100%;
        padding: 1rem;
    }
}
    </style>
</head>

 <script src="./mengetik.js"></script>

<script>
    const pilihTh = document.querySelector('.memilihTH');
    const pilihanOpsi = document.querySelector('.pilihanOpsi');

    const memilihKategori = document.querySelector('.memilihKategori');
    const pilihanOpsiKategori = document.querySelector('.pilihanOpsiKategori');

    pilihTh.addEventListener("click", function(){
        console.log("pencet");
        pilihTh.classList.toggle('sedangMemilih');
        pilihanOpsi.classList.toggle('actived');
    });

    memilihKategori.addEventListener("click", function(){
        console.log("pencet");
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
    pilihanOpsiKategori.querySelector(".background").addEventListener("click", function(){
        memilihKategori.classList.toggle('sedangMemilih');
        pilihanOpsiKategori.classList.toggle('pilihanOpsiKategoriMuncul');
    });
        


</script>

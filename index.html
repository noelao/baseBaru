<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elplongor Base</title>
    <link
      rel="preload"
      href="./public/fonts/mobbin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="./public/css/main.css" />
    <link rel="stylesheet" href="./public/css/navBar.css" />
    <!-- main css -->
  </head>

  <body>
    <!-- <header></header> -->

    <div class="navbar">
      <div class="iniNav">
        <div class="iniWarnaNav">
          <div class="atas">
            <div class="garis"></div>
          </div>
          <div class="bawah">
            <a href="index.html" class="logo">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 192 192"
                width="24"
                height="24"
              >
                <path d="M 0 0 H 192 L 0 192 H 192 Z" fill="currentColor" />
              </svg>
            </a>
            <div class="navMenu">
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const navMenu = document.querySelector(".iniWarnaNav .navMenu");
      navMenu.addEventListener("click", function () {
        navMenu.parentElement.parentElement.parentElement.parentElement.classList.toggle(
          "kepencet",
        );
      });
    </script>

    <style>
      .content {
        .sapaan {
          padding: 1rem 3rem;
          margin: 5rem 0;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          line-height: 1;
          gap: 2rem;
          h1 {
            text-align: center;
            font-size: 2.3rem;
          }
          .subTitle {
            font-size: 1rem;
            text-align: center;
            opacity: 0.5;
            font-weight: 600;
          }
          .creator {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            img {
              border-radius: 0.75rem;
              width: 100%;
            }
            .bawah {
              width: 100%;
              display: flex;
              justify-content: space-between;
            }
            .kanan {
              background-color: #ec1d1d;
              width: 5rem;
              border-radius: 0.75rem;
              display: flex;
              align-items: center;
              justify-content: center;
              cursor: pointer;
              gap: 0.5rem;
              color: white;
              span {
                font-weight: 600;
                font-size: 0.9rem;
              }
              svg {
                height: 1rem;
                rotate: -90deg;
              }
            }
          }
        }
        .favorite {
          margin: 6rem 0;
          width: 100%;
          padding: 1rem;
          .produk {
            width: 100%;
            padding: 1rem 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .5rem;
            a {
                width: 100%;
                height: 5rem;
                background-color: var(--bgUngu);
                position: relative;
                .title {
                    width: 100%;
                    

                    --tw-backdrop-blur: blur(24px);
                    backdrop-filter: var(--tw-backdrop-blur);

                    background-color: hsl(0 0% 93% / 72%);
                    text-align: center;
                    padding: .2rem;
                    position: relative;
                    z-index: 1;
                    small {
                        font-size: .7rem;
                        font-weight: 600;
                    }
                }
                .fotoLink {
                    position: absolute;
                    top: 0;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    overflow: hidden;
                    img {
                        height: 100%;
                        scale: 3;
                    }
                }
            }
          }
        }
      }
    </style>
    <div class="content">
      <div class="sapaan">
        <h1 class="muncul2">Creator Web Space</h1>
        <span class="subTitle"
          >support creator agar tetap bisa berkarya dan menghiboer.</span
        >
        <div class="creator">
          <img
            src="https://yt3.googleusercontent.com/kVU3nSXPI4GtP3y4PNjIyiTTiXXnayz3hlrWbh5JQdtfYrr3AvliDZvqsZVKEV4tF7ePNwrX=s160-c-k-c0x00ffffff-no-rj"
            alt=""
          />
          <div class="bawah">
            <div class="kiri">
              <h2>noelao</h2>
              <small>@elplongor</small>
            </div>
            <a
              target="_blank"
              rel="noopener"
              href="https://www.youtube.com/@elplongor"
              class="kanan"
            >
              <span> subs </span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="3"
                stroke="white"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"
                />
              </svg>
            </a>
          </div>
        </div>
      </div>
      <div class="favorite">
        <h2 style="padding: 0 2rem">Favorite ~</h2>
        <div class="produk">
            <a href="base.html" class="base">
                <div class="title">
                    <small>Base Link</small>
                </div>
                <div class="fotoLink">
                    <img src="./public/image/iconLink/base.webp" alt="">
                </div>
            </a>
            <a href="pasukan.html" class="pasukan">
                <div class="title">
                    <small>Troops Link</small>
                </div>
                <div class="fotoLink">
                    <img src="./public/image/iconLink/base.webp" alt="">
                </div>

            </a>
        </div>
      </div>
    </div>

    <!-- css untuk footer -->
    <style>
      /* Footer Container */
      .main-footer {
        min-height: 50vh;

        width: 100%;
        padding: 20px 0;
        border-top: 1px solid #eeeeee; /* Garis tipis transparan */
        background-color: transparent; /* Mengikuti background body */
        font-family: inherit; /* Menggunakan font utama kamu */
        margin-top: 1rem;
      }

      .footer-content {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        color: #666; /* Warna teks abu-abu minimalis */
        font-size: 0.9rem;
      }

      /* Styling Efek Mengetik */
      .highlight {
        color: #333; /* Warna lebih gelap untuk teks yang diketik */
        font-weight: 600;
      }

      .cursor {
        color: #007bff; /* Warna kursor (sesuaikan dengan tema kamu) */
        font-weight: bold;
        animation: blink 0.7s infinite;
        background: #007bff;
      }

      /* Responsif untuk HP */
      @media (max-width: 600px) {
        .footer-content {
          flex-direction: column;
          gap: 10px;
          text-align: center;
        }
      }
    </style>
    <footer class="main-footer">
      <div class="footer-content">
        <div class="footer-left">
          <p>&copy; 2026 noelao. All rights reserved.</p>
        </div>

        <div class="footer-right">
          <p>
            Build with Love <span id="typing-text" class="highlight"></span
            ><span class="cursor">💖</span>
          </p>
          <p>
            Design inspired by
            <a target="_blank" href="https://mobbin.com">mobbin</a>
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
